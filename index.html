<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090703" />
    <link rel="icon" href="data:," />
    <title>OMEGALOG</title>
  </head>
  <body>
    <div class="ambient-bg" aria-hidden="true"></div>

    <main class="app-shell">
      <header class="hero">
        <div class="codex-words" aria-hidden="true">
          <span>TRUTH</span>
          <span>POWER</span>
          <span>SCALE</span>
          <span>EDGE</span>
          <span>CONTROL</span>
          <span>VISION</span>
        </div>
        <h1>OMEGALOG</h1>
        <p>记录、归档与检索你的事件轨迹</p>
      </header>

      <button id="open-folder-btn" class="cta" type="button">打开日志文件夹</button>

      <p id="support-warning" class="warning hidden">
        此应用需要支持 File System Access API 的 Chrome 或 Edge 浏览器。
      </p>

      <section id="welcome-view" class="panel">
        <p>选择一个文件夹。每条日志都会成为一个真实文件。</p>
      </section>

      <section id="workspace-view" class="panel hidden">
        <div class="workspace-layout">
          <aside id="focus-panel" class="focus-panel hidden" aria-live="polite">
            <p class="focus-kicker">焦点事件</p>
            <div id="focus-image" class="focus-image" aria-hidden="true"></div>
            <h2 id="focus-title">暂无进行中事件</h2>
            <div class="focus-meta-row">
              <p id="focus-deadline" class="focus-deadline">--</p>
              <p id="focus-countdown" class="focus-countdown">--</p>
            </div>
            <p id="focus-note" class="focus-note"></p>
            <div id="focus-tags" class="focus-tags" aria-label="焦点事件标签"></div>
            <div class="focus-actions">
              <button id="focus-edit-btn" class="secondary-action" type="button">调整事件</button>
              <button id="focus-complete-btn" class="gold-action" type="button">标记完成</button>
              <button id="focus-cover-btn" class="secondary-action" type="button">生成头图</button>
            </div>
          </aside>

          <form id="log-form" class="composer-panel hidden" autocomplete="off" aria-labelledby="log-form-title">
            <p id="log-form-title" class="composer-title">新增日志</p>

            <label for="log-title">标题</label>
            <input
              id="log-title"
              type="text"
              maxlength="120"
              placeholder="写下要征服的事项"
              required
            />

            <label for="log-note">备注（可选）</label>
            <textarea
              id="log-note"
              rows="3"
              placeholder="补充一点线索或上下文"
            ></textarea>

            <label for="log-tags">任务标签（可选）</label>
            <input
              id="log-tags"
              type="text"
              maxlength="120"
              placeholder="例如：复习, 英语, 阅读"
            />

            <label for="log-weight">权重</label>
            <div class="weight-field">
              <input id="log-weight" type="range" min="1" max="10" step="1" value="5" />
              <output id="log-weight-value" for="log-weight">5</output>
            </div>

            <label for="log-deadline">截止时间</label>
            <input id="log-deadline" type="datetime-local" />

            <div class="composer-actions">
              <button id="log-submit" type="submit" class="cta add-btn">写入日志</button>
            </div>
          </form>

          <section class="archive-panel">
            <div class="archive-top">
              <div>
                <h2>事件档案</h2>
                <p>
                  当前档案库：
                  <span id="folder-name">未选择文件夹</span>
                </p>
              </div>
              <div class="stats" aria-label="日志统计">
                <span><strong>总计：</strong> <span id="count-total">0</span></span>
                <span><strong>进行中：</strong> <span id="count-active">0</span></span>
                <span><strong>已完成：</strong> <span id="count-completed">0</span></span>
              </div>
            </div>

            <div class="archive-tools">
              <label class="search-box" for="archive-search">
                <span aria-hidden="true">⌕</span>
                <input id="archive-search" type="search" placeholder="搜索事件标题、内容或标签..." />
              </label>
              <button id="filter-toggle" class="filter-button" type="button">筛选</button>
            </div>

            <div class="archive-table-head">
              <span>事件标题</span>
              <button id="priority-sort-btn" class="table-sort" type="button">标签</button>
              <button id="created-sort-btn" class="table-sort" type="button">创建时间 ↓</button>
              <span>状态 / 操作</span>
            </div>

            <div id="no-logs" class="empty-state">还没有日志。创建第一条。</div>
            <div id="log-list" class="archive-list" role="list" aria-label="日志列表"></div>

            <div id="archive-footer" class="archive-footer" aria-label="分页"></div>
          </section>
        </div>
      </section>
    </main>

    <button
      id="add-log-fab"
      class="fab"
      type="button"
      aria-label="新增日志"
      aria-controls="log-form"
      aria-expanded="false"
    >
      +
    </button>

    <div
      id="status-toast"
      class="status-toast hidden"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <div
      id="congrats-overlay"
      class="overlay hidden"
      role="status"
      aria-live="assertive"
      aria-atomic="true"
      aria-hidden="true"
    >
      <div id="particle-layer" class="particle-layer"></div>
      <section class="congrats-panel">
        <p class="congrats-kicker">CONGRATULATIONS</p>
        <h2>恭喜完成</h2>
        <p>又一枚明日碎片，已经归档。</p>
      </section>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
